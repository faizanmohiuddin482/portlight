name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and current runner images: netstat's columns differ between them.
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The macos-14 image defaults to Xcode 15 (Swift 5.10); the package needs Swift 6.
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_1[6-9]*.app | sort -V | tail -1)" && swift --version
      - run: swift build
      - run: swift test
